[build-system]
requires = ["setuptools >= 77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bizkaibus"
version = "1.1.1"
description = "Online information for buses of Biscay bus services (Basque Country, Spain)."
authors = [
    {name = "Ugaitz Etxebarria", email = "etxeba17@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9"]
keywords = ["Bizkaibus", "Bizkaia", "Autobusa", "rtpi", "buses"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.5",
]

[project.urls]
"Homepage" = "https://github.com/UgaitzEtxebarria/BizkaibusRTPI"
"Source" = "https://github.com/UgaitzEtxebarria/BizkaibusRTPI"
"Download" = "https://github.com/UgaitzEtxebarria/BizkaibusRTPI/archive/refs/tags/v1.1.1.tar.gz"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py39"]
